services:
  mysql:
    image: ${MYSQL_IMAGE:-mysql:8.4}
    container_name: ${MYSQL_CONTAINER_NAME:-rpmarketplace-mysql}
    restart: ${RESTART_POLICY:-unless-stopped}
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-rp_marketplace}
      MYSQL_USER: ${MYSQL_USER:-rpmarketplace}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-CHANGE_ME_MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-CHANGE_ME_MYSQL_ROOT_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    networks:
      - rpmarketplace
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u$${MYSQL_USER} -p$${MYSQL_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  backend:
    image: ${BACKEND_IMAGE:-rpmarketplace-backend:latest}
    container_name: ${BACKEND_CONTAINER_NAME:-rpmarketplace-backend}
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    restart: ${RESTART_POLICY:-unless-stopped}
    environment:
      MYSQL_HOST: ${MYSQL_HOST:-mysql}
      MYSQL_PORT: ${MYSQL_PORT:-3306}
      MYSQL_USER: ${MYSQL_USER:-rpmarketplace}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-CHANGE_ME_MYSQL_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-rp_marketplace}
      SESSION_SECRET: ${SESSION_SECRET:-CHANGE_ME_SESSION_SECRET}
      LEGACY_PRODUCT_OWNER_USERNAME: ${LEGACY_PRODUCT_OWNER_USERNAME:-CHANGE_ME_LEGACY_OWNER}
      APP_ENV: ${APP_ENV:-development}
      APP_PORT: ${APP_PORT:-5000}
      AI_DIAGNOSTICS_ENABLED: ${AI_DIAGNOSTICS_ENABLED:-false}
      AI_PROVIDER: ${AI_PROVIDER:-local}
    expose:
      - "5000"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - rpmarketplace
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/login', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  frontend:
    image: ${FRONTEND_IMAGE:-rpmarketplace-frontend:latest}
    container_name: ${FRONTEND_CONTAINER_NAME:-rpmarketplace-frontend}
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
    restart: ${RESTART_POLICY:-unless-stopped}
    environment:
      BACKEND_INTERNAL_URL: ${BACKEND_INTERNAL_URL:-http://backend:5000}
      APP_ENV: ${APP_ENV:-development}
    ports:
      - "${FRONTEND_PORT:-5000}:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - rpmarketplace
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  jenkins:
    image: ${JENKINS_IMAGE:-rpmarketplace-jenkins:latest}
    container_name: ${JENKINS_CONTAINER_NAME:-rpmarketplace-jenkins}
    build:
      context: .
      dockerfile: Dockerfile.jenkins
    restart: ${RESTART_POLICY:-unless-stopped}
    profiles:
      - ci
    environment:
      JENKINS_ADMIN_ID: ${JENKINS_ADMIN_ID:-admin}
      JENKINS_ADMIN_PASSWORD: ${JENKINS_ADMIN_PASSWORD:-CHANGE_ME_JENKINS_PASSWORD}
      JENKINS_URL: ${JENKINS_URL:-http://jenkins:8080}
      JENKINS_JAVA_OPTS: ${JENKINS_JAVA_OPTS:--Djenkins.install.runSetupWizard=false}
      CASC_JENKINS_CONFIG: /var/jenkins_home/casc_configs/jenkins.yaml
      GITHUB_USER: ${GITHUB_USER:-jackso271}
      GITHUB_PAT: ${GITHUB_PAT:-CHANGE_ME_GITHUB_PAT}
      GIT_REPO_URL: ${GIT_REPO_URL:-https://github.com/jackso271/C270-E62H-Team3.git}
      GIT_BRANCH_STAGING: ${GIT_BRANCH_STAGING:-staging-environment}
      GIT_BRANCH_PRODUCTION: ${GIT_BRANCH_PRODUCTION:-main}
      DOCKERHUB_USERNAME: ${DOCKERHUB_USERNAME:-jackdevil19}
      DOCKERHUB_TOKEN: ${DOCKERHUB_TOKEN:-CHANGE_ME_DOCKERHUB_TOKEN}
      SONAR_TOKEN: ${SONAR_TOKEN:-CHANGE_ME_SONAR_TOKEN}
      SONAR_HOST_URL: ${SONAR_HOST_URL:-http://sonarqube:9000}
      NEXUS_USER: ${NEXUS_USER:-admin}
      NEXUS_PASSWORD: ${NEXUS_PASSWORD:-CHANGE_ME_NEXUS_PASSWORD}
      NEXUS_URL: ${NEXUS_URL:-http://nexus:8081}
      AI_DIAGNOSTICS_ENABLED: ${AI_DIAGNOSTICS_ENABLED:-false}
      AI_PROVIDER: ${AI_PROVIDER:-local}
      AI_DIAGNOSTICS_MAX_CHARS: ${AI_DIAGNOSTICS_MAX_CHARS:-12000}
      AI_DIAGNOSTICS_TIMEOUT: ${AI_DIAGNOSTICS_TIMEOUT:-10}
      AI_DIAGNOSTICS_OPENAI_MODEL: ${AI_DIAGNOSTICS_OPENAI_MODEL:-gpt-4.1-mini}
    ports:
      - "${JENKINS_HTTP_PORT:-8080}:8080"
      - "${JENKINS_AGENT_PORT:-50000}:50000"
    group_add:
      - "${DOCKER_SOCKET_GID:-0}"
    volumes:
      - jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
      - ./:/workspace
    depends_on:
      sonarqube:
        condition: service_started
    networks:
      - rpmarketplace

  sonar-db:
    image: ${SONAR_DB_IMAGE:-postgres:16-alpine}
    container_name: ${SONAR_DB_CONTAINER_NAME:-rpmarketplace-sonar-db}
    restart: ${RESTART_POLICY:-unless-stopped}
    profiles:
      - ci
    environment:
      POSTGRES_DB: ${SONAR_DB_NAME:-sonarqube}
      POSTGRES_USER: ${SONAR_DB_USER:-sonarqube}
      POSTGRES_PASSWORD: ${SONAR_DB_PASSWORD:-CHANGE_ME_SONAR_DATABASE_PASSWORD}
    volumes:
      - sonar_db_data:/var/lib/postgresql/data
    networks:
      - rpmarketplace
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  sonarqube:
    image: ${SONARQUBE_IMAGE:-sonarqube:community}
    container_name: ${SONARQUBE_CONTAINER_NAME:-rpmarketplace-sonarqube}
    restart: ${RESTART_POLICY:-unless-stopped}
    profiles:
      - ci
    environment:
      SONAR_JDBC_URL: jdbc:postgresql://sonar-db:5432/${SONAR_DB_NAME:-sonarqube}
      SONAR_JDBC_USERNAME: ${SONAR_DB_USER:-sonarqube}
      SONAR_JDBC_PASSWORD: ${SONAR_DB_PASSWORD:-CHANGE_ME_SONAR_DATABASE_PASSWORD}
    ports:
      - "${SONARQUBE_PORT:-9000}:9000"
    volumes:
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_extensions:/opt/sonarqube/extensions
      - sonarqube_logs:/opt/sonarqube/logs
    depends_on:
      sonar-db:
        condition: service_healthy
    networks:
      - rpmarketplace

  nexus:
    image: ${NEXUS_IMAGE:-sonatype/nexus3:latest}
    container_name: ${NEXUS_CONTAINER_NAME:-rpmarketplace-nexus}
    restart: ${RESTART_POLICY:-unless-stopped}
    profiles:
      - nexus
    environment:
      INSTALL4J_ADD_VM_PARAMS: -Xms512m -Xmx1024m -XX:MaxDirectMemorySize=1024m
      NEXUS_SECURITY_RANDOMPASSWORD: "false"
    ports:
      - "${NEXUS_UI_PORT:-8081}:8081"
      - "${NEXUS_REGISTRY_PORT:-8082}:8082"
    volumes:
      - nexus_data:/nexus-data
    networks:
      - rpmarketplace

  ansible-runner:
    image: ${ANSIBLE_IMAGE:-rpmarketplace-ansible:latest}
    container_name: ${ANSIBLE_CONTAINER_NAME:-rpmarketplace-ansible}
    build:
      context: .
      dockerfile: ansible/Dockerfile
    profiles:
      - tools
    working_dir: /workspace
    environment:
      ANSIBLE_HOST_KEY_CHECKING: ${ANSIBLE_HOST_KEY_CHECKING:-False}
      APP_ENV: ${APP_ENV:-development}
      AI_DIAGNOSTICS_ENABLED: ${AI_DIAGNOSTICS_ENABLED:-false}
      AI_PROVIDER: ${AI_PROVIDER:-local}
    volumes:
      - ./:/workspace
      - /var/run/docker.sock:/var/run/docker.sock
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - rpmarketplace

networks:
  rpmarketplace:
    name: ${DOCKER_NETWORK_NAME:-rpmarketplace-network}
    driver: bridge

volumes:
  mysql_data:
  jenkins_home:
    external: true
    name: ${JENKINS_VOLUME_NAME:-jenkins-data}
  sonarqube_data:
  sonarqube_extensions:
  sonarqube_logs:
  sonar_db_data:
  nexus_data:

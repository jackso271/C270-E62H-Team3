sonar.projectKey=rpmarketplace
sonar.projectName=RP Marketplace
sonar.sourceEncoding=UTF-8

# Scan the repository and identify the tests separately.
sonar.sources=.
sonar.tests=tests
sonar.test.inclusions=tests/**/*.py

# Ignore temporary and generated files.
sonar.exclusions=tests/**,.venv-ci/**,artifacts/**,**/__pycache__/**,**/*.pyc,.git/**

# Import the coverage report created earlier by Jenkins.
sonar.python.version=3.11
sonar.python.coverage.reportPaths=artifacts/coverage.xml
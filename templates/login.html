<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RP Marketplace Login</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body class="login-body">

    <div class="login-container">

        <div class="login-card">

            <!-- RP Logo -->
            <img src="{{ url_for('static', filename='images/rp-logo.png') }}"
                 alt="RP Logo"
                 class="rp-logo">

            <h1>RP Marketplace</h1>

            <p class="subtitle">
                Buy and sell safely with RP students
            </p>

            <!-- Login Form -->
            <form method="POST" action="/login">

                <label>RP Email or Student ID</label>

                <input
                    type="text"
                    name="login_input"
                    placeholder="e.g. 23012345@myrp.edu.sg"
                    required
                >

                <label>Password</label>

                <input
                    type="password"
                    name="password"
                    placeholder="Enter password"
                    required
                >

                <button type="submit">
                    Login
                </button>

            </form>

            <!-- Error Message -->
            {% if error %}
                <p class="error">{{ error }}</p>
            {% endif %}

            <p class="footer-text">
                Only verified RP students can access this marketplace.
            </p>

        </div>

    </div>

</body>

</html>

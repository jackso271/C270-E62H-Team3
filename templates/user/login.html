<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RP Marketplace Login</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body class="login-body">

    <div class="login-container">

        <div class="login-card">

            <!-- RP Logo -->
            <img
                src="{{ url_for('static', filename='images/rp-logo.png') }}"
                alt="RP Logo"
                class="rp-logo"
            >

            <!-- Title -->
            <h1>RP Marketplace</h1>

            <!-- Subtitle -->
            <p class="subtitle">
                Buy and sell with RP students
            </p>

            <!-- Login Form -->
            <form action="/login" method="POST">

                <label>
                    RP Student ID / RP Email / Admin
                </label>

                <input
                    type="text"
                    name="login_id"
                    placeholder="Enter your ID, email or admin"
                    required
                >

                <label>
                    Password
                </label>

                <input
                    type="password"
                    name="password"
                    placeholder="Enter password"
                    required
                >

                <button type="submit">
                    Login
                </button>

            </form>

            <!-- Footer -->
            <p class="footer-text">
                New to RP Market?
                <a href="/register">Create Account</a>
            </p>

        </div>

    </div>

</body>

</html>

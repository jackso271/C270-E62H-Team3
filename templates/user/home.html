<!DOCTYPE html>
<html>
<head>
    <title>RP Marketplace Home</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

    <nav class="navbar">
        <div class="nav-logo">RP Marketplace</div>
        <a href="/logout" class="logout-btn">Logout</a>
    </nav>

    <section class="hero">
        <div>
            <h1>Welcome, {{ name }}</h1>
            <p>Discover items listed by RP students around campus.</p>
            <a href="#" class="primary-btn">Browse Marketplace</a>
        </div>
    </section>

    <section class="features">
        <div class="feature-card">
            <h3>Verified RP Users</h3>
            <p>Only RP students can access the marketplace.</p>
        </div>

        <div class="feature-card">
            <h3>Campus Deals</h3>
            <p>Find affordable items from students nearby.</p>
        </div>

        <div class="feature-card">
            <h3>Safe Requests</h3>
            <p>Send purchase requests before buying.</p>
        </div>
    </section>

</body>
</html>

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Failed Login Logs</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body class="admin-page">

    <div class="admin-container">

        <!-- Back Button -->

        <a href="/admin/dashboard" class="back-btn">
            ← Back to Dashboard
        </a>

        <!-- Title -->

        <h1>Failed Login Logs</h1>

        <!-- Filter Box -->

        <form method="GET" class="search-box">

            <input
                type="number"
                name="day"
                placeholder="Day"
                min="1"
                max="31"
                value="{{ day or '' }}"
            >

            <input
                type="number"
                name="month"
                placeholder="Month"
                min="1"
                max="12"
                value="{{ month or '' }}"
            >

            <input
                type="number"
                name="year"
                placeholder="Year"
                value="{{ year or '' }}"
            >

            <button type="submit" class="filter-btn">
                Filter
            </button>

            <a href="/admin/failed-logs" class="clear-search-btn">
                Clear
            </a>

        </form>

        <!-- Delete Form -->

        <form action="/admin/delete-failed-logs" method="POST">

            <button type="submit" class="delete-selected-btn">
                Delete Selected Logs
            </button>

            <!-- Table -->

            <table class="admin-table">

                <thead>

                    <tr>

                        <th>
                            <input
                                type="checkbox"
                                onclick="toggleSelectAll(this)"
                            >
                        </th>

                        <th>Username</th>

                        <th>Reason</th>

                        <th>Time</th>

                    </tr>

                </thead>

                <tbody>

                    {% for log in failed_logs %}

                    <tr>

                        <td>
                            <input
                                type="checkbox"
                                name="selected_logs"
                                value="{{ log.time }}"
                            >
                        </td>

                        <td>{{ log.username }}</td>

                        <td>{{ log.reason }}</td>

                        <td>{{ log.time }}</td>

                    </tr>

                    {% endfor %}

                </tbody>

            </table>

        </form>

    </div>

    <script>

        function toggleSelectAll(source) {

            const checkboxes =
                document.querySelectorAll(
                    'input[name="selected_logs"]'
                );

            checkboxes.forEach(function(checkbox) {

                checkbox.checked = source.checked;

            });

        }

    </script>

</body>

</html>

<!DOCTYPE html>
<html>
<head>
    <title>Successful Login Logs</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='admin.css') }}">
</head>

<body class="admin-body">

    <div class="admin-page">

        <a href="/admin/dashboard" class="back-btn">← Back to Dashboard</a>

        <h1>Successful Login Logs</h1>

        <form method="GET" class="filter-box">
            <input type="number" name="day" placeholder="Day" min="1" max="31" value="{{ day or '' }}">
            <input type="number" name="month" placeholder="Month" min="1" max="12" value="{{ month or '' }}">
            <input type="number" name="year" placeholder="Year" value="{{ year or '' }}">

            <button type="submit">Filter</button>
            <a href="/admin/success-logs" class="clear-btn">Clear</a>
        </form>

        <form action="/admin/delete-success-logs" method="POST">

            <button type="submit" class="delete-selected-btn">
                Delete Selected Logs
            </button>

            <table>
                <tr>
                    <th>
                        <input type="checkbox" onclick="toggleSelectAll(this)">
                    </th>
                    <th>Name</th>
                    <th>Username</th>
                    <th>Role</th>
                    <th>Time</th>
                </tr>

                {% for log in success_logs %}
                <tr>
                    <td>
                        <input type="checkbox" name="selected_logs" value="{{ log.time }}">
                    </td>
                    <td>{{ log.name }}</td>
                    <td>{{ log.username }}</td>
                    <td>{{ log.role }}</td>
                    <td>{{ log.time }}</td>
                </tr>
                {% endfor %}
            </table>

        </form>

    </div>

    <script>
        function toggleSelectAll(source) {
            const checkboxes = document.querySelectorAll('input[name="selected_logs"]');

            checkboxes.forEach(function(checkbox) {
                checkbox.checked = source.checked;
            });
        }
    </script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>My Products – Seller Dashboard</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Syne:wght@700&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0f1117;
      --surface: #1a1d27;
      --border: #2a2d3a;
      --accent: #6c63ff;
      --accent-dim: rgba(108,99,255,0.12);
      --green: #22c55e;
      --green-dim: rgba(34,197,94,0.12);
      --red: #ef4444;
      --red-dim: rgba(239,68,68,0.12);
      --text: #e8eaf0;
      --muted: #7b7f96;
      --card-hover: #1f2235;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'DM Sans', sans-serif;
      min-height: 100vh;
      padding: 40px 24px;
    }

    header {
      max-width: 860px;
      margin: 0 auto 40px;
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      border-bottom: 1px solid var(--border);
      padding-bottom: 24px;
    }

    header .title-block h1 {
      font-family: 'Syne', sans-serif;
      font-size: 2rem;
      letter-spacing: -0.5px;
      color: var(--text);
    }

    header .title-block p {
      color: var(--muted);
      margin-top: 4px;
      font-size: 0.9rem;
    }

    .stats {
      display: flex;
      gap: 20px;
    }

    .stat {
      text-align: right;
    }

    .stat .num {
      font-family: 'Syne', sans-serif;
      font-size: 1.5rem;
      color: var(--text);
    }

    .stat .label {
      font-size: 0.75rem;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    main {
      max-width: 860px;
      margin: 0 auto;
    }

    .toolbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    .filter-tabs {
      display: flex;
      gap: 8px;
    }

    .filter-tab {
      padding: 6px 16px;
      border-radius: 20px;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--muted);
      font-family: 'DM Sans', sans-serif;
      font-size: 0.85rem;
      cursor: pointer;
      transition: all 0.2s;
    }

    .filter-tab.active, .filter-tab:hover {
      background: var(--accent-dim);
      border-color: var(--accent);
      color: var(--accent);
    }

    .btn-add {
      padding: 8px 20px;
      background: var(--accent);
      color: white;
      border: none;
      border-radius: 8px;
      font-family: 'DM Sans', sans-serif;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.2s;
    }

    .btn-add:hover { opacity: 0.85; }

    #product-list { display: flex; flex-direction: column; gap: 12px; }

    .product-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 20px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      transition: background 0.2s, border-color 0.2s;
      animation: fadeIn 0.3s ease both;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .product-card:hover {
      background: var(--card-hover);
      border-color: var(--accent);
    }

    .product-info h3 {
      font-size: 1rem;
      font-weight: 600;
      color: var(--text);
      margin-bottom: 4px;
    }

    .product-info .desc {
      font-size: 0.85rem;
      color: var(--muted);
      margin-bottom: 10px;
    }

    .product-meta {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .price {
      font-family: 'Syne', sans-serif;
      font-size: 1.1rem;
      color: var(--text);
    }

    .status-badge {
      padding: 3px 12px;
      border-radius: 20px;
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }

    .status-available {
      background: var(--green-dim);
      color: var(--green);
      border: 1px solid rgba(34,197,94,0.3);
    }

    .status-sold {
      background: rgba(255,255,255,0.05);
      color: var(--muted);
      border: 1px solid var(--border);
    }

    .product-actions {
      display: flex;
      gap: 8px;
      flex-shrink: 0;
    }

    .btn-edit, .btn-delete {
      padding: 7px 16px;
      border-radius: 7px;
      border: 1px solid;
      font-family: 'DM Sans', sans-serif;
      font-size: 0.83rem;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-edit {
      background: transparent;
      border-color: var(--border);
      color: var(--text);
    }

    .btn-edit:hover {
      background: var(--accent-dim);
      border-color: var(--accent);
      color: var(--accent);
    }

    .btn-delete {
      background: transparent;
      border-color: var(--border);
      color: var(--muted);
    }

    .btn-delete:hover {
      background: var(--red-dim);
      border-color: var(--red);
      color: var(--red);
    }

    .empty-state {
      text-align: center;
      padding: 60px 20px;
      color: var(--muted);
    }

    .empty-state span { font-size: 2.5rem; display: block; margin-bottom: 12px; }

    /* Modal */
    .modal-overlay {
      display: none;
      position: fixed; inset: 0;
      background: rgba(0,0,0,0.6);
      backdrop-filter: blur(4px);
      z-index: 100;
      align-items: center;
      justify-content: center;
    }

    .modal-overlay.open { display: flex; }

    .modal {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 32px;
      width: 100%;
      max-width: 440px;
    }

    .modal h2 {
      font-family: 'Syne', sans-serif;
      font-size: 1.3rem;
      margin-bottom: 24px;
    }

    .form-group {
      margin-bottom: 16px;
    }

    .form-group label {
      display: block;
      font-size: 0.82rem;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 6px;
    }

    .form-group input, .form-group select, .form-group textarea {
      width: 100%;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px 14px;
      color: var(--text);
      font-family: 'DM Sans', sans-serif;
      font-size: 0.9rem;
      outline: none;
      transition: border-color 0.2s;
    }

    .form-group input:focus,
    .form-group select:focus,
    .form-group textarea:focus {
      border-color: var(--accent);
    }

    .form-group textarea { resize: vertical; min-height: 80px; }

    .modal-actions {
      display: flex;
      gap: 10px;
      margin-top: 24px;
      justify-content: flex-end;
    }

    .btn-cancel {
      padding: 8px 20px;
      background: transparent;
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--muted);
      font-family: 'DM Sans', sans-serif;
      cursor: pointer;
    }

    .btn-save {
      padding: 8px 20px;
      background: var(--accent);
      border: none;
      border-radius: 8px;
      color: white;
      font-family: 'DM Sans', sans-serif;
      font-weight: 600;
      cursor: pointer;
    }

    .toast {
      position: fixed;
      bottom: 30px; right: 30px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px 20px;
      font-size: 0.9rem;
      color: var(--text);
      opacity: 0;
      transform: translateY(10px);
      transition: all 0.3s;
      z-index: 200;
    }

    .toast.show { opacity: 1; transform: translateY(0); }
  </style>
</head>
<body>

  <header>
    <div class="title-block">
      <h1>My Products</h1>
      <p>Manage your listings</p>
    </div>
    <div class="stats">
      <div class="stat">
        <div class="num" id="stat-total">–</div>
        <div class="label">Total</div>
      </div>
      <div class="stat">
        <div class="num" id="stat-available">–</div>
        <div class="label">Available</div>
      </div>
      <div class="stat">
        <div class="num" id="stat-sold">–</div>
        <div class="label">Sold</div>
      </div>
    </div>
  </header>

  <main>
    <div class="toolbar">
      <div class="filter-tabs">
        <button class="filter-tab active" onclick="filterProducts('all', this)">All</button>
        <button class="filter-tab" onclick="filterProducts('available', this)">Available</button>
        <button class="filter-tab" onclick="filterProducts('sold', this)">Sold</button>
      </div>
      <button class="btn-add" onclick="openModal()">+ Add Listing</button>
    </div>

    <div id="product-list">
      <div class="empty-state"><span>📦</span>Loading your products...</div>
    </div>
  </main>

  <!-- Edit / Add Modal -->
  <div class="modal-overlay" id="modal">
    <div class="modal">
      <h2 id="modal-title">Add New Listing</h2>
      <input type="hidden" id="edit-id"/>
      <div class="form-group">
        <label>Product Name</label>
        <input type="text" id="field-name" placeholder="e.g. Calculus Textbook"/>
      </div>
      <div class="form-group">
        <label>Description</label>
        <textarea id="field-desc" placeholder="Condition, edition, etc."></textarea>
      </div>
      <div class="form-group">
        <label>Price ($)</label>
        <input type="number" id="field-price" placeholder="0.00" min="0" step="0.01"/>
      </div>
      <div class="form-group" id="status-group" style="display:none">
        <label>Status</label>
        <select id="field-status">
          <option value="Available">Available</option>
          <option value="Sold">Sold</option>
        </select>
      </div>
      <div class="modal-actions">
        <button class="btn-cancel" onclick="closeModal()">Cancel</button>
        <button class="btn-save" onclick="saveProduct()">Save</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    // ─── CONFIG ───────────────────────────────────────────────
    // Change this to match whatever port your backend runs on
    const API_BASE = 'http://localhost:5000';

    // Hardcoded for now — replace with session/login logic later
    const SELLER_ID = 1;

    // ─── STATE ────────────────────────────────────────────────
    let allProducts = [];
    let currentFilter = 'all';

    // ─── LOAD PRODUCTS ────────────────────────────────────────
    async function loadProducts() {
      try {
        const res = await fetch(`${API_BASE}/api/products?seller_id=${SELLER_ID}`);
        allProducts = await res.json();
        updateStats();
        renderProducts();
      } catch (err) {
        document.getElementById('product-list').innerHTML =
          `<div class="empty-state"><span>⚠️</span>Could not connect to server.</div>`;
      }
    }

    function updateStats() {
      const available = allProducts.filter(p => p.status === 'Available').length;
      const sold = allProducts.filter(p => p.status === 'Sold').length;
      document.getElementById('stat-total').textContent = allProducts.length;
      document.getElementById('stat-available').textContent = available;
      document.getElementById('stat-sold').textContent = sold;
    }

    function renderProducts() {
      const list = document.getElementById('product-list');
      const filtered = currentFilter === 'all'
        ? allProducts
        : allProducts.filter(p => p.status.toLowerCase() === currentFilter);

      if (filtered.length === 0) {
        list.innerHTML = `<div class="empty-state"><span>📦</span>No products found.</div>`;
        return;
      }

      list.innerHTML = filtered.map((p, i) => `
        <div class="product-card" style="animation-delay:${i * 0.05}s">
          <div class="product-info">
            <h3>${p.name}</h3>
            <p class="desc">${p.description || 'No description'}</p>
            <div class="product-meta">
              <span class="price">$${parseFloat(p.price).toFixed(2)}</span>
              <span class="status-badge status-${p.status.toLowerCase()}">${p.status}</span>
            </div>
          </div>
          <div class="product-actions">
            <button class="btn-edit" onclick='openEditModal(${JSON.stringify(p)})'>Edit</button>
            <button class="btn-delete" onclick="deleteProduct(${p.id})">Delete</button>
          </div>
        </div>
      `).join('');
    }

    function filterProducts(filter, btn) {
      currentFilter = filter;
      document.querySelectorAll('.filter-tab').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      renderProducts();
    }

    // ─── ADD / EDIT MODAL ─────────────────────────────────────
    function openModal() {
      document.getElementById('modal-title').textContent = 'Add New Listing';
      document.getElementById('edit-id').value = '';
      document.getElementById('field-name').value = '';
      document.getElementById('field-desc').value = '';
      document.getElementById('field-price').value = '';
      document.getElementById('status-group').style.display = 'none';
      document.getElementById('modal').classList.add('open');
    }

    function openEditModal(product) {
      document.getElementById('modal-title').textContent = 'Edit Listing';
      document.getElementById('edit-id').value = product.id;
      document.getElementById('field-name').value = product.name;
      document.getElementById('field-desc').value = product.description || '';
      document.getElementById('field-price').value = product.price;
      document.getElementById('field-status').value = product.status;
      document.getElementById('status-group').style.display = 'block';
      document.getElementById('modal').classList.add('open');
    }

    function closeModal() {
      document.getElementById('modal').classList.remove('open');
    }

    async function saveProduct() {
      const id = document.getElementById('edit-id').value;
      const body = {
        seller_id: SELLER_ID,
        name: document.getElementById('field-name').value.trim(),
        description: document.getElementById('field-desc').value.trim(),
        price: parseFloat(document.getElementById('field-price').value),
        status: document.getElementById('field-status').value || 'Available'
      };

      if (!body.name || isNaN(body.price)) {
        showToast('Please fill in all required fields.');
        return;
      }

      if (id) {
        await fetch(`${API_BASE}/api/products/${id}`, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(body)
        });
        showToast('Product updated!');
      } else {
        await fetch(`${API_BASE}/api/products`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(body)
        });
        showToast('Product added!');
      }

      closeModal();
      loadProducts();
    }

    // ─── DELETE ───────────────────────────────────────────────
    async function deleteProduct(id) {
      if (!confirm('Remove this listing?')) return;
      await fetch(`${API_BASE}/api/products/${id}`, { method: 'DELETE' });
      showToast('Product deleted.');
      loadProducts();
    }

    // ─── TOAST ────────────────────────────────────────────────
    function showToast(msg) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.classList.add('show');
      setTimeout(() => t.classList.remove('show'), 2500);
    }

    // Close modal on overlay click
    document.getElementById('modal').addEventListener('click', e => {
      if (e.target === e.currentTarget) closeModal();
    });

    loadProducts();
  </script>
</body>
</html>

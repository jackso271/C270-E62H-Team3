<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ product.title }} | RP Marketplace</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="marketplace-body">
{% set active_page = "marketplace" %}
{% include "partials/user_navbar.html" %}

<main class="marketplace-shell product-detail-shell">
<section class="marketplace-intro">
<h1>{{ product.title }}</h1>

<p>Price: ${{ product.price }}</p>
<p>Seller: {{ product.seller }}</p>
<p>Category: {{ product.category }}</p>
<p>{{ product.description }}</p>

<br>

<a href="/chat">
    <button>Contact Seller</button>
</a>

<br><br>

<a href="/report/{{ product.id }}">
    <button>Report Listing</button>
</a>

<br><br>

<a href="/marketplace">Back to Marketplace</a>
</section>
</main>
</body>
</html>

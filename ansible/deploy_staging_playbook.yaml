---
- name: Deploy RP Marketplace staging container
  hosts: all
  gather_facts: false

  tasks:
    - name: Verify Docker is installed
      command: docker --version
      changed_when: false

    - name: Verify staging environment file exists
      stat:
        path: "{{ playbook_dir }}/../.env"
      register: staging_env_file

    - name: Stop deployment when staging environment file is missing
      fail:
        msg: "Missing .env file. Create it from .env.example and provide MySQL credentials before deploying."
      when: not staging_env_file.stat.exists

    - name: Read staging environment file for validation
      slurp:
        path: "{{ playbook_dir }}/../.env"
      register: staging_env_file_content
      no_log: true

    - name: Validate required staging environment variables are present
      assert:
        that:
          - "'MYSQL_HOST=' in staging_env_text"
          - "'MYSQL_PORT=' in staging_env_text"
          - "'MYSQL_USER=' in staging_env_text"
          - "'MYSQL_PASSWORD=' in staging_env_text"
          - "'MYSQL_DATABASE=' in staging_env_text"
          - "'SESSION_SECRET=' in staging_env_text"
          - "'LEGACY_PRODUCT_OWNER_USERNAME=' in staging_env_text"
        fail_msg: "The staging .env file is missing one or more required keys. Compare it with .env.example without printing secret values."
        success_msg: "Staging .env contains the required keys."
      vars:
        staging_env_text: "{{ staging_env_file_content.content | b64decode }}"
      no_log: true

    - name: Stop existing staging container if it exists
      command: docker stop rpmarketplace-staging
      register: stop_container
      failed_when: false
      changed_when: stop_container.rc == 0

    - name: Remove existing staging container if it exists
      command: docker rm rpmarketplace-staging
      register: remove_container
      failed_when: false
      changed_when: remove_container.rc == 0

    - name: Build staging Docker image
      command:
        argv:
          - docker
          - build
          - -t
          - rp-marketplace-staging
          - "{{ playbook_dir }}/.."

    - name: Run staging container on port 5002
      command:
        argv:
          - docker
          - run
          - -d
          - --name
          - rpmarketplace-staging
          - --env-file
          - "{{ playbook_dir }}/../.env"
          - -e
          - MYSQL_HOST=host.docker.internal
          - --add-host
          - host.docker.internal:host-gateway
          - -p
          - "5002:5000"
          - rp-marketplace-staging

    - name: Verify staging app is reachable
      uri:
        url: http://host.docker.internal:5002/
        status_code: 200
      register: app_check
      retries: 10
      delay: 3
      until: app_check.status == 200
      changed_when: false

---
# Deploy the RP Marketplace app locally with Docker.
# The playbook keeps the demo simple: verify Docker, rebuild the image,
# replace the existing container, then confirm the Flask app responds.
- name: Deploy RP Marketplace Docker container
  hosts: all
  gather_facts: false

  tasks:
    - name: Verify Docker is installed
      command: docker --version
      changed_when: false

    - name: Stop existing rpmarketplace container if it exists
      command: docker stop rpmarketplace
      register: stop_container
      failed_when: false
      changed_when: stop_container.rc == 0

    - name: Remove existing rpmarketplace container if it exists
      command: docker rm rpmarketplace
      register: remove_container
      failed_when: false
      changed_when: remove_container.rc == 0

    - name: Build Docker image rp-marketplace
      command:
        argv:
          - docker
          - build
          - -t
          - rp-marketplace
          - "{{ playbook_dir }}/.."

    - name: Run rpmarketplace container on port 5000
      command:
        argv:
          - docker
          - run
          - -d
          - --name
          - rpmarketplace
          - -p
          - "5000:5000"
          - rp-marketplace

    - name: Verify the app is reachable
      uri:
        url: http://host.docker.internal:5000
        status_code: 200
      register: app_check
      retries: 10
      delay: 3
      until: app_check.status == 200
      changed_when: false

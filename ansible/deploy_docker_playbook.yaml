---
- name: Deploy RP Marketplace production container
  hosts: all
  gather_facts: false

  tasks:
    - name: Verify Docker is installed
      command: docker --version
      changed_when: false

    - name: Verify production environment file exists
      stat:
        path: "{{ playbook_dir }}/../.env"
      register: production_env_file

    - name: Stop deployment when production environment file is missing
      fail:
        msg: "Missing .env file. Create it from .env.example and provide MySQL credentials before deploying."
      when: not production_env_file.stat.exists

    - name: Read production environment file for validation
      slurp:
        path: "{{ playbook_dir }}/../.env"
      register: production_env_file_content
      no_log: true

    - name: Validate required production environment variables are present
      assert:
        that:
          - "'MYSQL_HOST=' in production_env_text"
          - "'MYSQL_PORT=' in production_env_text"
          - "'MYSQL_USER=' in production_env_text"
          - "'MYSQL_PASSWORD=' in production_env_text"
          - "'MYSQL_DATABASE=' in production_env_text"
          - "'SESSION_SECRET=' in production_env_text"
          - "'LEGACY_PRODUCT_OWNER_USERNAME=' in production_env_text"
        fail_msg: "The production .env file is missing one or more required keys. Compare it with .env.example without printing secret values."
        success_msg: "Production .env contains the required keys."
      vars:
        production_env_text: "{{ production_env_file_content.content | b64decode }}"
      no_log: true

    - name: Stop existing production container if it exists
      command: docker stop rpmarketplace
      register: stop_container
      failed_when: false
      changed_when: stop_container.rc == 0

    - name: Remove existing production container if it exists
      command: docker rm rpmarketplace
      register: remove_container
      failed_when: false
      changed_when: remove_container.rc == 0

    - name: Build production Docker image
      command:
        argv:
          - docker
          - build
          - -t
          - rp-marketplace
          - "{{ playbook_dir }}/.."

    - name: Run production container on port 5000
      command:
        argv:
          - docker
          - run
          - -d
          - --name
          - rpmarketplace
          - --env-file
          - "{{ playbook_dir }}/../.env"
          - -e
          - MYSQL_HOST=host.docker.internal
          - --add-host
          - host.docker.internal:host-gateway
          - -p
          - "5000:5000"
          - rp-marketplace

    - name: Verify production app is reachable
      uri:
        url: http://host.docker.internal:5000/
        status_code: 200
      register: app_check
      retries: 10
      delay: 3
      until: app_check.status == 200
      changed_when: false
